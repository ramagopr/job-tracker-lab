upstream job_tracker {
    zone job_tracker 64k;

    server api:8000  max_fails=1 fail_timeout=10s;
    server api2:8000 max_fails=1 fail_timeout=10s;
    server api3:8000 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        proxy_pass http://job_tracker;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout;
        proxy_next_upstream_tries 3;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Backend $upstream_addr always;
    }
}